[Rainmeter]
Update=1000
AccurateText=1
MiddleMouseDownAction=[!ToggleFade]
; Position (WindowX/Y/Anchor) is NOT set here - once a skin has been loaded
; and positioned, Rainmeter remembers its position in its own settings file
; (%APPDATA%\Rainmeter\Rainmeter.ini, [GruvGold\Clock] section) and that
; stored value wins over anything in this file on every subsequent load. Fix
; the position there, not here.

[Metadata]
Name=GruvGold Clock
Author=—
Information=Bottom-centre desktop clock. Time and meridiem share one line; day and date sit underneath.
Version=2.1

[Variables]
; Palette - keep in sync with palette.json at the repo root.
ColorFG=251,241,199,255
ColorDim=189,174,147,215
FontFace=JetBrainsMono NF

TimeSize=46
DateSize=13

; Skin box. Rainmeter derives a skin's size from its meter extents, and with a
; centred StringAlign the X value is the text's centre point - so without an
; explicit box the skin is sized wrong and centring it does not centre the text.
BoxW=640
BoxH=110
CentreX=320

; ---------------------------------------------------------------- measures
[MeasureTime]
Measure=Time
Format=%I:%M %p

[MeasureWeekday]
Measure=Time
Format=%A

[MeasureDate]
Measure=Time
Format=%#d %B %Y

; ---------------------------------------------------------------- meters
[MeterBox]
Meter=Image
X=0
Y=0
W=#BoxW#
H=#BoxH#
SolidColor=0,0,0,1

; Time and AM/PM are ONE meter so the pair centres as a unit - two meters
; cannot be centred together without hard-coding each one's width. The
; meridiem itself stays full size - InlinePattern only matches the literal
; space %1 already contains (between minutes and AM/PM; there is no other
; space in this string), and InlineSetting shrinks just that one character's
; font size, narrowing its advance width to a fraction of a monospace cell
; instead of the full cell a plain space would otherwise be.
[MeterTime]
Meter=String
MeasureName=MeasureTime
X=#CentreX#
Y=0
FontFace=#FontFace#
FontSize=#TimeSize#
FontColor=#ColorFG#
StringAlign=CenterTop
StringStyle=Bold
AntiAlias=1
InlineSetting=Size | 24
InlinePattern=( )
Text=%1

; Day and date on one line underneath, in the subdued cream.
[MeterDate]
Meter=String
MeasureName=MeasureWeekday
MeasureName2=MeasureDate
X=#CentreX#
Y=4R
FontFace=#FontFace#
FontSize=#DateSize#
FontColor=#ColorDim#
StringAlign=CenterTop
StringStyle=Bold
AntiAlias=1
Text=%1 | %2
