[Rainmeter]
Update=16
AccurateText=1
DefaultUpdateDivider=-1
MiddleMouseDownAction=[!ToggleFade]

[Metadata]
Name=GruvGold Visualizer
Author=—
Information=Audio bar visualiser using Rainmeter's built-in AudioLevel plugin.
Version=1.0

[Variables]
BarCount=24
BarWidth=8
BarGap=4
BarMaxHeight=54
ColorBar=213,172,69,225

; ---------------------------------------------------------------- audio
; AudioLevel ships with Rainmeter - no external dependency, no cava needed.
[MeasureAudio]
Measure=Plugin
Plugin=AudioLevel
Port=Output
FFTSize=2048
FFTOverlap=1024
FFTAttack=20
FFTDecay=180
Bands=#BarCount#
FreqMin=30
FreqMax=14000
Sensitivity=42
UpdateDivider=1

; ---------------------------------------------------------------- bands
; One child measure and one meter per band, generated by hand because Rainmeter
; has no loop construct. BarCount above must match the number of blocks here.
[MeasureBand1]
Measure=Plugin
Plugin=AudioLevel
Parent=MeasureAudio
Type=Band
BandIdx=0
UpdateDivider=1
