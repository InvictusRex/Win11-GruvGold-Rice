; ---------------------------------------------------------------- meters
; Fixes the skin bounds: 24 bars x (8 wide + 4 gap) - 4 trailing gap = 284.
[MeterBox]
Meter=Image
X=0
Y=0
W=284
H=54
SolidColor=0,0,0,1

[StyleBar]
Meter=Bar
BarColor=#ColorBar#
BarOrientation=Vertical
SolidColor=0,0,0,1
W=#BarWidth#
H=#BarMaxHeight#
Y=0
AntiAlias=1
UpdateDivider=1

